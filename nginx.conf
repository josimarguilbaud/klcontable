server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El proxy termina TLS y habla HTTP con este contenedor, así que nginx cree
    # que la petición llegó por http y construiría las Location absolutas con
    # ese esquema: cada redirección costaría un salto extra para volver a https.
    # Con esto la Location queda relativa y el navegador conserva el esquema.
    # (Lección aprendida en las webs de San Blas — no quitar.)
    absolute_redirect off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El sitio se construye con `trailingSlash: 'always'` porque las URLs que
    # Google ya conoce terminaban en barra. Quien llegue sin ella —un enlace
    # escrito a mano, un directorio antiguo— tiene que acabar en la buena, no
    # en un 404.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Los assets con hash en el nombre no cambian nunca: se pueden cachear a
    # largo plazo sin miedo a servir una versión vieja.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El HTML sí cambia en cada despliegue. Sin esto, un cliente con la página
    # cacheada no vería un cambio de precio hasta que su navegador decidiera.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── 301 de las URLs indexadas de la web anterior ─────────────────────
    # El sitio caido vivia en /services/ (prefijo en ingles con slugs en
    # espanol). Esas son las unicas URLs con historial en Google, asi que la
    # redireccion transfiere su autoridad a la ruta nueva.
    #
    # NO SE QUITAN NUNCA. Siempre quedara un enlace viejo apuntando aqui, y
    # una 301 que desaparece convierte ese enlace en un 404 y tira lo ganado.
    location = /services/ { return 301 /servicios/; }
    location = /services  { return 301 /servicios/; }
    location ~ ^/services/(.*)$ { return 301 /servicios/$1; }

    error_page 404 /404.html;

    # Cabeceras básicas. No incluye HSTS: eso lo pone el proxy, que es quien
    # termina TLS; duplicarlo aquí no añade nada y confunde al depurar.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
